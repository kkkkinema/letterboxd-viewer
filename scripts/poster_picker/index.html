<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Poster Picker · Moon’s Film Diary</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/picker.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <span class="eyebrow">Local Studio</span>
      <h1 class="brand">Poster <em>Picker</em></h1>
      <span class="counter" id="customCounter">Loading…</span>
    </div>

    <div class="topbar-actions">
      <label class="toggle-chip" title="Jump to next film automatically after saving a poster">
        <input type="checkbox" id="autoAdvanceToggle" checked />
        <span>Auto-advance</span>
      </label>
      <button type="button" class="btn btn-ghost" id="pullBtn">↓ Pull Latest</button>
      <button type="button" class="btn btn-push" id="pushBtn">↑ Push to GitHub</button>
      <span class="local-badge">127.0.0.1</span>
    </div>
  </header>

  <div class="banner" id="statusBanner" hidden>
    <span id="statusBannerText"></span>
    <button type="button" class="banner-close" id="statusBannerClose" aria-label="Dismiss">×</button>
  </div>

  <main class="workspace">
    <!-- Left Column: Searchable Film List -->
    <aside class="sidebar">
      <div class="sidebar-controls">
        <input type="search" id="filmSearch" class="input" placeholder="Search film, director, or year…" />

        <div class="filter-pills" id="queuePills">
          <button type="button" class="pill active" data-queue="needs_review">Needs review</button>
          <button type="button" class="pill" data-queue="unmatched" id="unmatchedPill">Unmatched</button>
          <button type="button" class="pill" data-queue="customized" id="customizedPill">Customized</button>
          <button type="button" class="pill" data-queue="all">All</button>
        </div>

        <div class="select-row">
          <select id="ratingFilter" class="select" aria-label="Filter by rating or favorites">
            <option value="all">All Ratings</option>
            <option value="liked">Liked ♥</option>
            <option value="reviews">Written Reviews</option>
            <option value="4.5+">4.5★ &amp; Up</option>
            <option value="4+">4★ &amp; Up</option>
            <option value="5">★★★★★ (5)</option>
            <option value="4.5">★★★★½ (4.5)</option>
            <option value="4">★★★★ (4)</option>
            <option value="3.5">★★★½ (3.5)</option>
            <option value="3">★★★ (3)</option>
            <option value="le2.5">2.5★ &amp; Under</option>
            <option value="unrated">Unrated</option>
          </select>
          <select id="yearFilter" class="select" aria-label="Filter by release year">
            <option value="all">All Years</option>
          </select>
        </div>

        <select id="sortFilter" class="select" aria-label="Sort films">
          <option value="rating_desc">Sort: Highest Rated (Favorites First)</option>
          <option value="recent">Sort: Recently Watched</option>
          <option value="alpha">Sort: Title (A–Z)</option>
        </select>
      </div>

      <div class="film-list" id="filmList">
        <div class="empty-note">Loading film archive…</div>
      </div>
    </aside>

    <!-- Right Column: Alternate Poster Gallery -->
    <section class="detail" id="detailPane">
      <div class="empty-state">Select a film on the left to choose an alternate poster.</div>
    </section>
  </main>

  <div class="toast" id="toast" hidden></div>

  <script src="/picker.js" defer></script>
</body>
</html>
