<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
	<title>Film Diary</title>
	<meta name="description" content="A personal film blog &amp; diary archive synced from Letterboxd — every logged watch, rating, and review." />
	<meta name="theme-color" content="#0c0c0e" />
	<meta name="apple-mobile-web-app-capable" content="yes" />
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
	<meta name="apple-mobile-web-app-title" content="Film Diary" />
	<link rel="manifest" href="manifest.json" />
	<link rel="icon" type="image/svg+xml" href="assets/images/icon.svg" />
	<link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png" />
	<meta property="og:type" content="website" />
	<meta property="og:url" content="" />
	<meta property="og:title" content="Film Diary" />
	<meta property="og:description" content="A personal film blog &amp; diary archive synced from Letterboxd — every logged watch, rating, and review." />
	<meta property="og:image" content="assets/images/og-card.png?v=2" />
	<meta property="og:image:width" content="1200" />
	<meta property="og:image:height" content="630" />
	<meta name="twitter:card" content="summary_large_image" />
	<meta name="twitter:title" content="Film Diary" />
	<meta name="twitter:description" content="A personal film blog &amp; diary archive synced from Letterboxd — every logged watch, rating, and review." />
	<meta name="twitter:image" content="assets/images/og-card.png?v=2" />
	<script>
		(function () {
			var saved = localStorage.getItem('diary_theme');
			var theme = saved || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
			document.documentElement.setAttribute('data-theme', theme);
			if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true) {
				document.documentElement.classList.add('is-standalone');
			}
		})();
	</script>
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
	<link rel="stylesheet" href="assets/css/editorial.css?v=18" />
</head>
<body>
	<!-- Masthead -->
	<header class="masthead">
		<div class="masthead-inner">
			<a href="#" class="brand" id="brandHome">
				<h1 class="brand-title">My <em>Film Diary</em></h1>
				<span class="brand-meta">Screening Journal</span>
			</a>
			<div class="masthead-actions">
				<div class="search-wrap">
					<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
					<input type="search" id="searchInput" class="search-input" placeholder="Search films or reviews…" aria-label="Search films" />
					<span class="search-kbd">/</span>
				</div>
				<a href="about.html" class="nav-link">About</a>
				<button type="button" class="icon-btn" id="themeToggle" title="Toggle theme" aria-label="Toggle theme"></button>
			</div>
		</div>
	</header>

	<main class="container">
		<!-- Latest Reviews Carousel Hero -->
		<section class="hero-section" id="heroSection" hidden></section>

		<!-- Filters, View Toggle & Sort -->
		<section class="toolbar" aria-label="Filter and sort diary">
			<div class="filter-pills" id="filterPills">
				<button type="button" class="pill active" data-filter="all">All Films <span class="count" id="countAll">0</span></button>
				<button type="button" class="pill" data-filter="reviews">Reviews <span class="count" id="countReviews">0</span></button>
				<button type="button" class="pill" data-filter="liked">Liked ♥ <span class="count" id="countLiked">0</span></button>
				<button type="button" class="pill" data-filter="top">4★ &amp; Up <span class="count" id="countTop">0</span></button>
				<button type="button" class="pill" data-filter="rewatch">Rewatches <span class="count" id="countRewatch">0</span></button>
			</div>

			<div class="toolbar-right" id="toolbarRight">
				<div class="view-toggle" id="viewToggle" role="group" aria-label="Switch layout view">
					<button type="button" class="view-btn active" data-view="grid" title="Poster grid">
						<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
						Grid
					</button>
					<button type="button" class="view-btn" data-view="diary" title="Chronological diary list">
						<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
						Diary
					</button>
				</div>
				<button type="button" class="filter-toggle-btn" id="filterDrawerToggle" aria-expanded="false" aria-controls="filterDrawer">
					<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="7" y1="12" x2="17" y2="12"/><line x1="10" y1="18" x2="14" y2="18"/></svg>
					<span>Filters</span>
					<span class="filter-badge" id="filterActiveBadge" hidden>0</span>
				</button>
			</div>
		</section>

		<!-- Collapsible Filter & Sort Drawer -->
		<section class="filter-drawer" id="filterDrawer" aria-label="Advanced filters and sorting" hidden>
			<div class="filter-drawer-grid">
				<select id="yearSelect" class="sort-select" aria-label="Filter by watched year">
					<option value="all">All Years</option>
				</select>
				<select id="monthSelect" class="sort-select" aria-label="Filter by watched month">
					<option value="all">All Months</option>
					<option value="01">January</option>
					<option value="02">February</option>
					<option value="03">March</option>
					<option value="04">April</option>
					<option value="05">May</option>
					<option value="06">June</option>
					<option value="07">July</option>
					<option value="08">August</option>
					<option value="09">September</option>
					<option value="10">October</option>
					<option value="11">November</option>
					<option value="12">December</option>
				</select>
				<select id="ratingSelect" class="sort-select" aria-label="Filter by rating">
					<option value="all">All Ratings</option>
					<option value="5">★★★★★ (5)</option>
					<option value="4.5">★★★★½ (4.5)</option>
					<option value="4">★★★★ (4)</option>
					<option value="3.5">★★★½ (3.5)</option>
					<option value="3">★★★ (3)</option>
					<option value="2.5">★★½ (2.5)</option>
					<option value="2">★★ (2)</option>
					<option value="1.5">★½ (1.5)</option>
					<option value="1">★ (1)</option>
					<option value="0.5">½ (0.5)</option>
					<option value="unrated">Unrated</option>
				</select>
				<select id="decadeSelect" class="sort-select" aria-label="Filter by release decade">
					<option value="all">All Decades</option>
				</select>
				<select id="sortSelect" class="sort-select" aria-label="Sort films">
					<option value="recent">Recently Watched</option>
					<option value="rating-desc">Highest Rated</option>
					<option value="year-desc">Release Year (Newest)</option>
					<option value="year-asc">Release Year (Oldest)</option>
					<option value="title-asc">Title (A–Z)</option>
				</select>
				<button type="button" id="resetFiltersBtn" class="btn-ghost filter-reset-btn" hidden>Reset all</button>
			</div>
		</section>

		<!-- Content Grid / Diary List -->
		<section id="contentArea">
			<div class="state-box">Loading screening journal…</div>
		</section>
	</main>

	<!-- Colophon Footer -->
	<footer class="colophon">
		<div class="container colophon-inner">
			<div class="colophon-stats" id="colophonStats"></div>
			<div class="colophon-links">
				<a href="about.html">About</a>
				<span>·</span>
				<span>Film Diary</span>
			</div>
		</div>
	</footer>

	<!-- Split-Screen Reader Modal -->
	<div class="modal-backdrop" id="readerBackdrop" role="dialog" aria-modal="true" aria-labelledby="readerTitle">
		<div class="reader-modal" id="readerModal">
			<div class="reader-drag-handle" aria-hidden="true"><span></span></div>
			<aside class="reader-aside" id="readerAside">
				<img src="" alt="" class="reader-poster" id="readerPoster" />
				<div class="reader-facts" id="readerFacts"></div>
			</aside>
			<div class="reader-content">
				<div class="reader-top-bar">
					<div class="reader-nav">
						<button type="button" class="icon-btn" id="prevBtn" title="Previous (←)" aria-label="Previous entry">←</button>
						<button type="button" class="icon-btn" id="nextBtn" title="Next (→)" aria-label="Next entry">→</button>
						<span class="reader-counter" id="readerCounter"></span>
					</div>
					<div class="reader-top-actions">
						<button type="button" class="btn-ghost" id="shareCardBtn" style="padding: 0.32rem 0.78rem; font-size: 0.73rem;">Share card</button>
						<button type="button" class="btn-ghost" id="copyLinkBtn" style="padding: 0.32rem 0.78rem; font-size: 0.73rem;">Copy link</button>
						<button type="button" class="icon-btn" id="closeReaderBtn" title="Close (Esc)" aria-label="Close modal">✕</button>
					</div>
				</div>
				<div class="reader-scroll" id="readerScroll">
					<h2 class="reader-title" id="readerTitle"></h2>
					<p class="reader-director" id="readerDirector" hidden></p>
					<div class="reader-subtitle" id="readerSubtitle"></div>
					<div class="reader-prose" id="readerProse"></div>
				</div>
			</div>
		</div>
	</div>

	<!-- Shareable Review / Diary Card Modal -->
	<div class="modal-backdrop" id="shareBackdrop" role="dialog" aria-modal="true" aria-labelledby="shareHeading">
		<div class="share-modal">
			<div class="share-header">
				<div>
					<h2 id="shareHeading">Shareable Card</h2>
					<p>Export a clean PNG for Instagram, X, or messages.</p>
				</div>
				<button type="button" class="icon-btn" id="closeShareBtn" aria-label="Close share dialog">✕</button>
			</div>

			<div class="share-controls">
				<div class="share-control-row">
					<div class="view-toggle share-style-pills" id="shareStyleToggle" role="group" aria-label="Card design style">
						<button type="button" class="view-btn active" data-style="folio">Folio</button>
						<button type="button" class="view-btn" data-style="affiche">Affiche</button>
						<button type="button" class="view-btn" data-style="index">Index</button>
						<button type="button" class="view-btn" data-style="matte">Matte</button>
						<button type="button" class="view-btn" data-style="noir">Noir</button>
						<button type="button" class="view-btn" data-style="frame">Frame</button>
						<button type="button" class="view-btn" data-style="35mm">35mm</button>
						<button type="button" class="view-btn" data-style="plate">Plate</button>
					</div>
				</div>
				<div class="share-control-row">
					<div class="view-toggle" id="shareFormatToggle" role="group" aria-label="Card aspect ratio">
						<button type="button" class="view-btn active" data-format="card">4:5 Card</button>
						<button type="button" class="view-btn" data-format="story">9:16 Story</button>
					</div>
					<div class="view-toggle" id="shareThemeToggle" role="group" aria-label="Card color theme">
						<button type="button" class="view-btn active" data-card-theme="dark">Dark</button>
						<button type="button" class="view-btn" data-card-theme="light">Light</button>
					</div>
					<button type="button" class="toggle-chip active" id="shareReviewBtn" aria-pressed="true">
						<span id="shareReviewIcon">✓</span>
						<span>Review text</span>
					</button>
				</div>
			</div>

			<div class="share-preview-stage">
				<canvas id="shareCanvas" class="share-canvas"></canvas>
			</div>

			<div class="share-footer">
				<button type="button" class="btn-primary" id="downloadCardBtn" style="width: 100%; justify-content: center;">Download PNG</button>
			</div>
		</div>
	</div>

	<!-- Standalone Mobile Bottom Bar (PWA installed mode only) -->
	<nav class="pwa-tabbar" id="pwaTabbar" aria-label="App navigation">
		<button type="button" class="pwa-tab active" data-pwa-action="grid">
			<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
			<span>Grid</span>
		</button>
		<button type="button" class="pwa-tab" data-pwa-action="diary">
			<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
			<span>Diary</span>
		</button>
		<button type="button" class="pwa-tab" data-pwa-action="search">
			<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7.5"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
			<span>Search</span>
		</button>
		<button type="button" class="pwa-tab" data-pwa-action="random">
			<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.2" fill="currentColor"/><circle cx="15.5" cy="8.5" r="1.2" fill="currentColor"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/><circle cx="8.5" cy="15.5" r="1.2" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1.2" fill="currentColor"/></svg>
			<span>Random</span>
		</button>
	</nav>

	<!-- Toasts -->
	<div class="toast-stack" id="toastStack"></div>

	<script src="assets/js/share-cards.js?v=6" defer></script>
	<script src="assets/js/app.js?v=20" defer></script>
</body>
</html>
